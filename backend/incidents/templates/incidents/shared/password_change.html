{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password | Elevate</title>
  <link rel="stylesheet" href="{% static 'incidents/style.css' %}">
</head>
<body class="elevate-auth-body">
  <main class="login-page">
    <div class="auth-heading"><div class="brand-icon">⇅</div><div><strong>ELEVATE</strong><span>CONTROL SYSTEM</span></div></div>
    <section class="form auth-card">
      <h1>Change password</h1>
      <p class="auth-intro">Choose a new password for your staff account.</p>
      <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">SAVE PASSWORD</button></form>
      <p class="message"><a href="{% url 'dashboard' %}">Return to dashboard</a></p>
    </section>
  </main>
</body>
</html>
