<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Elevate{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f3f6fb; }
    body { margin: 0; } header { background: #142644; color: white; padding: 1rem max(1rem, calc((100% - 1000px)/2)); display:flex; justify-content:space-between; align-items:center; }
    header a { color:white; text-decoration:none; margin-left:1rem; } main { max-width:1000px; margin:2rem auto; padding:0 1rem; }
    .card { background:white; border:1px solid #dce3ee; border-radius:12px; padding:1.25rem; margin:1rem 0; }
    label { display:block; font-weight:600; margin:.85rem 0 .3rem; } input, select, textarea { box-sizing:border-box; width:100%; max-width:600px; padding:.7rem; border:1px solid #aebbd0; border-radius:6px; font:inherit; }
    button, .button { display:inline-block; background:#1769aa; color:white; border:0; border-radius:6px; padding:.7rem 1rem; font:inherit; text-decoration:none; cursor:pointer; margin-top:1rem; }
    table { width:100%; border-collapse:collapse; background:white; } th,td { padding:.75rem; border-bottom:1px solid #dce3ee; text-align:left; } .errorlist { color:#a21c2b; } .messages { padding:.8rem; background:#e5f7eb; }
  </style>
</head>
<body>
  <header><strong><a href="{% url 'home' %}">ELEVATE</a></strong><nav><a href="{% url 'report-incident' %}">Report an issue</a>{% if user.is_authenticated %}<a href="{% url 'dashboard' %}">Dashboard</a><a href="{% url 'incident-list' %}">Incidents</a><form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button type="submit" style="margin:0">Log out</button></form>{% else %}<a href="{% url 'login' %}">Staff login</a>{% endif %}</nav></header>
  <main>{% if messages %}{% for message in messages %}<p class="messages">{{ message }}</p>{% endfor %}{% endif %}{% block content %}{% endblock %}</main>
</body>
</html>
